  <text x="60" y="240" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="13" fill="#8b90b8">Kotlin · Jetpack Compose · Material 3 · Local JSON persistence</text>
