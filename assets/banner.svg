    <circle cx="770" cy="120" r="3.2" fill="#9b8cfa" fill-opacity="0.7"><animate attributeName="fill-opacity" values="0.35;0.95;0.35" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="66" r="3.2" fill="#fbbf24" fill-opacity="0.7"><animate attributeName="fill-opacity" values="0.35;0.95;0.35" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>
