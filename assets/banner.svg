    <radialGradient id="glow2" cx="88%" cy="60%" r="40%"><stop offset="0%" stop-color="#fbbf24" stop-opacity="0.12"/><stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c084fc" stop-opacity="0"/><stop offset="0.5" stop-color="#c084fc" stop-opacity="0.9"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
